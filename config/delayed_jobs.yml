production:
  workers:
    - queue: canvas_queue
      workers: <%= ENV.fetch("CANVAS_JOB_WORKERS_HIGH", "1") %>
      max_priority: 10
    - queue: canvas_queue
      workers: <%= ENV.fetch("CANVAS_JOB_WORKERS", "2") %>
  worker_max_job_count: 200
  worker_max_memory_usage: 1073741824

default:
  workers:
    - queue: canvas_queue
      workers: 1
