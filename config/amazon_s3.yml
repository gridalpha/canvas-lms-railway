<%
  require "json"
  endpoint = ENV["S3_ENDPOINT"].to_s
  endpoint = "https://#{endpoint}" unless endpoint.empty? || endpoint.start_with?("http")
%>
production:
  bucket_name: <%= ENV["S3_BUCKET"].to_s.to_json %>
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"].to_s.to_json %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"].to_s.to_json %>
  region: <%= (ENV["S3_REGION"].to_s.empty? ? "us-east-1" : ENV["S3_REGION"]).to_json %>
<% unless endpoint.empty? %>
  endpoint: <%= endpoint.to_json %>
  force_path_style: true
<% end %>
